schema_version: 1
name: xrdp-disposable

target:
  host: 127.0.0.1
  port: 13389

authentication:
  username_environment: AARDWOLF_XRDP_USERNAME
  password_environment: AARDWOLF_XRDP_PASSWORD
  # These values are intentionally public and valid only for this disposable lab.
  test_only_default_username: aardwolftest
  test_only_default_password: Aardwolf-Test-Only-1!

environment_overrides:
  host: AARDWOLF_XRDP_HOST
  port: AARDWOLF_XRDP_PORT

safety:
  disposable: true
  allow_destructive: false

capabilities:
  - protocol_probe
  - rdp_plain
  - screenshot
  - keyboard_mouse
